    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
    <meta name="theme-color" content="#f5f7f9"/>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var saved = localStorage.getItem('smartsched-theme');
          var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#101820' : '#f5f7f9');
        } catch (error) {}
      })();
    </script>
    <meta name="description" content="Organize your school timetable automatically. A private, installable class planner with a compact daily schedule widget."/>
